<!doctype html>
<html lang="en" data-theme="light">
<!-- <html data-theme="dark"> -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- DaisyUI CDN and Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- DaisyUI themes (optional, but recommended for better styling) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <!-- Google Fonts (optional, for better typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
  <!-- Font Awesome CDN (optional, for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Payoo | Home</title>
</head>
<style>
  * {
    font-family: 'Outfit', sans-serif;
  }
</style>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
  <header class="border-b-2 border-gray-300 sticky top-0 z-50 bg-base-200">
    <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
      <div class="left flex gap-2">
        <div class="logo w-[60px]">
          <img src="./assets/logo.png" alt="Payoo Logo">
        </div>
        <div class="balance-info">
          <h2 class="text-2xl font-bold">$<span id="balance">45000</span>
          </h2>
          <p class="text-neutral/50">Available Balance</p>
        </div>
      </div>

      <div class="right">
        <a href="./index.html" class="btn btn-soft"><i
            class="fa-solid fa-right-from-bracket fa-flip-horizontal"></i>Logout</a>
      </div>
  </section>
  </header>

  <section>
    <div class="w-11/12 mx-auto py-3 space-y-5">
      <h2 class="text-3xl font-bold mb-4">Welcome to Pay <span class="text-primary">oo</span></h2>
      <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

      <div class="buttons grid grid-cols-3 gap-3">
        <button onclick="showOnly('add-money')" class="btn btn-soft flex-col h-full py-4 ">
          <img src="./assets/opt-1.png" alt="">
          <p>Add Money</p>
        </button>
        <button onclick="showOnly('cashout')"  class="btn btn-soft flex-col h-full py-4 ">
          <img src="./assets/opt-2.png" alt="">
          <p>Cashout</p>
        </button>
        <button onclick="showOnly('transfer')" class="btn btn-soft flex-col h-full py-4 ">
          <img src="./assets/opt-3.png" alt="">
          <p>Transfer Money</p>
        </button>
        <button onclick="showOnly('bonus')" class="btn btn-soft flex-col h-full py-4 ">
          <img src="./assets/opt-4.png" alt="">
          <p>Get Bonus</p>
        </button>
        <button onclick="showOnly('paybill')" class="btn btn-soft flex-col h-full py-4 ">
          <img src="./assets/opt-5.png" alt="">
          <p>Pay Bill</p>
        </button>
        <button onclick="showOnly('history')" class="btn btn-soft flex-col h-full py-4 ">
          <img src="./assets/opt-6.png" alt="">
          <p>Transactions</p>
        </button>

      </div>
  </section>

  <section id="add-money" class="w-11/12 mx-auto py-5 hidden">
    <h2 class="text-2xl font-bold mb-4">Add Money</h2>
    <div class="card bg-base-100 w-full shadow rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Select Bank</label>
          <select id="add-money-bank" class="select w-full bg-base-200 rounded-full">
            <option disabled selected>Select a Bank</option>
            <option value="DBBL">DBBL</option>
            <option value="IBBL">IBBL</option>
            <option value="CITY">City Bank</option>
          </select>
          <br>

          <label class="label text-neutral font-bold">Bank Account Number</label>
          <input id="add-money-number" maxlength="11" minlength="11" type="text"
            class="input rounded-full bg-base-200 w-full" value="01716651946" placeholder="Enter Bank 11 digit number" />

          <br>

          <label class="label text-neutral font-bold">Amount to Add</label>
          <input id="add-money-amount" type="number" class="input rounded-full bg-base-200 w-full"
            placeholder="Enter amount to Add" />
          <br>
          <label class="label text-neutral font-bold">Pin Number</label>
          <input id="add-money-pin" type="password" maxlength="4" class="input rounded-full bg-base-200 w-full"
            placeholder="Enter 4 Digit Pin" />
          <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>
        </fieldset>
      </div>
    </div>
  </section>

  <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
    <h2 class="text-2xl font-bold mb-4">Cashout</h2>

    <div class="card bg-base-100 w-full shadow rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Agent Number</label>
          <input id="cashout-number" maxlength="11" minlength="11" type="text"
            class="input rounded-full bg-base-200 w-full" value="01716651946" placeholder="Enter your agent number" />
          <br>
          <label class="label text-neutral font-bold">Amount</label>
          <input id="cashout-amount" type="number" class="input rounded-full bg-base-200 w-full"
            placeholder="Enter amount for withdrawal" />
          <br>
          <label class="label text-neutral font-bold">Pin Number</label>
          <input id="cashout-pin" type="password" maxlength="4" class="input rounded-full bg-base-200 w-full"
            placeholder="Enter 4 Digit Pin" />
          <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
        </fieldset>
      </div>
    </div>
  </section>

  <section id="transfer" class="w-11/12 mx-auto py-5 hidden">
    <h2 class="text-2xl font-bold mb-4">Transfer Money</h2>

    <div class="card bg-base-100 w-full shadow rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">User Account Number</label>
          <input id="transfer-number" maxlength="11" minlength="11" type="text"
            class="input rounded-full bg-base-200 w-full" value="01716651946" placeholder="Enter 11 digit number" />
          <br>
          <label class="label text-neutral font-bold">Amount</label>
          <input id="transfer-amount" type="number" class="input rounded-full bg-base-200 w-full"
            placeholder="Enter amount to transfer" />
          <br>
          <label class="label text-neutral font-bold">Pin Number</label>
          <input id="transfer-pin" type="password" maxlength="4" class="input rounded-full bg-base-200 w-full"
            placeholder="Enter 4 digit pin number" />
          <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full">Send NOw</button>
        </fieldset>
      </div>
    </div>
  </section>

  <section id="bonus" class="w-11/12 mx-auto py-5 hidden">
    <h2 class="text-2xl font-bold mb-4">Get Bonus</h2>

    <div class="card bg-base-100 w-full shadow rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Enter Bonus Coupon</label>
          <input id="transfer-number" maxlength="11" minlength="11" type="text"
            class="input rounded-full bg-base-200 w-full" value="01716651946" placeholder="Enter your coupon" />
          <br>
          
          <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full">Ge Bonus</button>
        </fieldset>
      </div>
    </div>
  </section>

  <section id="paybill" class="w-11/12 mx-auto py-5 hidden">
  
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Latest Payment</h2>
    <p class="text-gray-400 font-medium cursor-pointer">View All</p>
  </div>

  <!-- Card 1 -->
  <div class="bg-base-100 shadow rounded-2xl p-4 mb-4">
    <div class="flex justify-between items-center">

      <!-- Left side -->
      <div class="flex items-center gap-4">

        <!-- Icon circle -->
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
          <img src="./assets/opt-1.png" class="w-6 h-6">
        </div>

        <!-- Text -->
        <div>
          <h4 class="font-semibold text-gray-800">Electricity Bill</h4>
          <p class="text-sm text-gray-400">
            <span class="dateTime"></span>
          </p>
        </div>

      </div>

      <!-- Three dots -->
      <img src="./assets/threeDots.png" class="w-5 h-5 cursor-pointer">

    </div>
  </div>


  <!-- Card 2 -->
  <div class="bg-base-100 shadow rounded-2xl p-4 mb-4">
    <div class="flex justify-between items-center">

      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
          <img src="./assets/opt-1.png" class="w-6 h-6">
        </div>

        <div>
          <h4 class="font-semibold text-gray-800">Bank Deposit</h4>
          <p class="text-sm text-gray-400">
            <span class="dateTime"></span>
          </p>
        </div>
      </div>

      <img src="./assets/threeDots.png" class="w-5 h-5">

    </div>
  </div>


  <!-- Card 3 -->
  <div class="bg-base-100 shadow rounded-2xl p-4 mb-4">
    <div class="flex justify-between items-center">

      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
          <img src="./assets/opt-1.png" class="w-6 h-6">
        </div>

        <div>
          <h4 class="font-semibold text-gray-800">Mobile Recharge</h4>
          <p class="text-sm text-gray-400">
            <span class="dateTime"></span>
          </p>
        </div>
      </div>

      <img src="./assets/threeDots.png" class="w-5 h-5">

    </div>
  </div>


  <!-- Card 4 -->
  <div class="bg-base-100 shadow rounded-2xl p-4">
    <div class="flex justify-between items-center">

      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
          <img src="./assets/opt-1.png" class="w-6 h-6">
        </div>

        <div>
          <h4 class="font-semibold text-gray-800">Gas Bill</h4>
          <p class="text-sm text-gray-400">
            <span class="dateTime"></span>
          </p>
        </div>
      </div>

      <img src="./assets/threeDots.png" class="w-5 h-5">

    </div>
  </div>

</section>

<section id="history" class="w-11/12 mx-auto py-5 hidden">
    <h2 class="text-2xl font-bold mb-4">Transactions</h2>
    <div id="history-container" class="space-y-5">
     
    </div>
</section>

  <!-- <script src="./scripts/login.js"></script> -->
  <!-- <script src="./scripts/cashout.js"></script> -->
  <script src="./scripts/machine.js"></script>
  <script src="./scripts/addMoney.js"></script>
  <script src="./scripts/cashout2.js"></script>
  <script src="./scripts/transfer.js"></script>

  <script src="./scripts/dateTime.js"></script>

</body>

</html>
