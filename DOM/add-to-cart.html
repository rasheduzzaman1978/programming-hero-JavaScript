<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to Cart</title>
</head>
<body>
    <h2>Products</h2>

    <div class="product">

      <div class="item">
        <h3 class="name">Laptop</h3>
        <p class="price">50000</p>
        <button class="addBtn">Add to Cart</button>
      </div>

      <div class="item">
        <h3 class="name">Mobile</h3>
        <p class="price">20000</p>
        <button class="addBtn">Add to Cart</button>
      </div>

      <div class="item">
        <h3 class="name">Headphone</h3>
        <p class="price">3000</p>
        <button class="addBtn">Add to Cart</button>
      </div>
      
    </div>

    <h2>Shopping Cart</h2>

    <ul id="cart"></ul>

    <script src="./add-to-cart.js"></script>
  </body>
</html>
