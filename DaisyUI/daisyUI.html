<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>DaisyUI Full Website</title>

  <!-- Tailwind + DaisyUI CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>


<!-- Navbar -->
<div class="navbar bg-base-100 shadow-md">

  <div class="flex-1">
    <a class="btn btn-ghost text-xl">MyWebsite</a>
  </div>

  <div class="flex-none">
    <ul class="menu menu-horizontal px-1">
      <li><a>Home</a></li>
      <li><a>About</a></li>
      <li><a>Contact</a></li>
    </ul>
  </div>

</div>



<!-- Hero Section -->
<div class="hero min-h-screen bg-base-200">

  <div class="hero-content text-center">

    <div class="max-w-md">

      <h1 class="text-5xl font-bold">
        Hello there
      </h1>

      <p class="py-6">
        This website is made using DaisyUI
      </p>

      <button class="btn btn-primary">
        Get Started
      </button>

    </div>

  </div>

</div>



<!-- Cards Section -->
<div class="py-20 px-10 bg-base-100">

<h2 class="text-3xl font-bold text-center mb-10">
Our Products
</h2>


<div class="grid grid-cols-1 md:grid-cols-3 gap-6">



<!-- Card 1 -->
<div class="card bg-base-200 shadow-xl">

  <figure>
    <img src="https://picsum.photos/400/200" />
  </figure>

  <div class="card-body">
    <h2 class="card-title">Product 1</h2>
    <p>Best product</p>
    <button class="btn btn-primary">
      Buy Now
    </button>
  </div>

</div>



<!-- Card 2 -->
<div class="card bg-base-200 shadow-xl">

  <figure>
    <img src="https://picsum.photos/400/201" />
  </figure>

  <div class="card-body">
    <h2 class="card-title">Product 2</h2>
    <p>Best product</p>
    <button class="btn btn-primary">
      Buy Now
    </button>
  </div>

</div>



<!-- Card 3 -->
<div class="card bg-base-200 shadow-xl">

  <figure>
    <img src="https://picsum.photos/400/202" />
  </figure>

  <div class="card-body">
    <h2 class="card-title">Product 3</h2>
    <p>Best product</p>
    <button class="btn btn-primary">
      Buy Now
    </button>
  </div>

</div>



</div>
</div>



<!-- Contact Section -->
<div class="py-20 bg-base-200">

<h2 class="text-3xl text-center font-bold mb-10">
Contact Us
</h2>


<div class="flex justify-center">

<div class="card w-96 bg-base-100 shadow-xl">

<div class="card-body">


<input type="text" placeholder="Name"
class="input input-bordered w-full" />


<input type="email" placeholder="Email"
class="input input-bordered w-full" />


<textarea class="textarea textarea-bordered"
placeholder="Message"></textarea>


<button class="btn btn-primary">
Send
</button>


</div>
</div>

</div>

</div>



<!-- Footer -->
<footer class="footer footer-center p-10 bg-base-300">

<div>

<p>
Copyright © 2025 - All rights reserved
</p>

</div>

</footer>



</body>
</html>
